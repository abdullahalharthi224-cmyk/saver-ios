# XcodeGen يقرأ هذا الملف ويولّد منه Saver.xcodeproj تلقائياً
name: Saver
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"     # رقم الإصدار الظاهر للمستخدم
    CURRENT_PROJECT_VERSION: "1"   # رقم البناء (build)

targets:
  Saver:
    type: application
    platform: iOS
    sources:
      - path: Saver
        excludes:
          - "**/.gitkeep"   # ملفات فارغة فقط لحفظ المجلدات في Git
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.saver
        TARGETED_DEVICE_FAMILY: "1"   # iPhone فقط
    info:
      # XcodeGen يكتب Info.plist من هذه القيم (لا نعدّله يدوياً)
      path: Saver/Info.plist
      properties:
        CFBundleDisplayName: Saver
        # شاشة الإقلاع (ملف storyboard): بدونها يشغّل iOS التطبيق بحجم iPhone 4 القديم
        UILaunchStoryboardName: LaunchScreen
        # النص الذي يظهر في نافذة طلب الإذن (بدونه يتوقف التطبيق فوراً)
        NSPhotoLibraryAddUsageDescription: Saver needs permission to save downloaded videos to your Photos.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme: {}                        # نحتاج scheme حتى يعمل xcodebuild archive
