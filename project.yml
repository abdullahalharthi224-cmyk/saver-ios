# XcodeGen يقرأ هذا الملف ويولّد منه Saver.xcodeproj تلقائياً
name: Saver
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"     # رقم الإصدار الظاهر للمستخدم
    CURRENT_PROJECT_VERSION: "1"   # رقم البناء (build)

targets:
  Saver:
    type: application
    platform: iOS
    sources:
      - path: Saver
        excludes:
          - "**/.gitkeep"   # ملفات فارغة فقط لحفظ المجلدات في Git
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.saver
        TARGETED_DEVICE_FAMILY: "1"   # iPhone فقط
    info:
      # XcodeGen يكتب Info.plist من هذه القيم (لا نعدّله يدوياً)
      path: Saver/Info.plist
      properties:
        CFBundleDisplayName: Saver
        # شاشة الإقلاع (ملف storyboard): بدونها يشغّل iOS التطبيق بحجم iPhone 4 القديم
        UILaunchStoryboardName: LaunchScreen
        # النص الذي يظهر في نافذة طلب الإذن (بدونه يتوقف التطبيق فوراً)
        NSPhotoLibraryAddUsageDescription: Saver needs permission to save downloaded videos to your Photos.
        # المرحلة 5: الاتصال بالخادم على جهازك داخل شبكة البيت
        NSLocalNetworkUsageDescription: Saver connects to the server on your PC to prepare videos.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true   # يسمح بـ http داخل الشبكة المحلية فقط
        NSBonjourServices:              # نوع الخدمة التي نبحث عنها في الشبكة
          - _saver._tcp
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: SaverShare            # يضع الـ extension داخل Saver.app/PlugIns
    scheme: {}                        # نحتاج scheme حتى يعمل xcodebuild archive

  # المرحلة 4: Share Extension (تطبيق صغير يظهر في قائمة المشاركة)
  SaverShare:
    type: app-extension
    platform: iOS
    sources:
      - path: SaverShare
      # نشارك نفس كود التحميل والحفظ مع التطبيق بدل نسخه
      - path: Saver/Services
      - path: Saver/Models
    settings:
      base:
        # يجب أن يبدأ بمعرّف التطبيق الأساسي
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.saver.share
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: SaverShare/Info.plist
      properties:
        CFBundleDisplayName: Saver
        NSPhotoLibraryAddUsageDescription: Saver needs permission to save downloaded videos to your Photos.
        NSLocalNetworkUsageDescription: Saver connects to the server on your PC to prepare videos.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _saver._tcp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController   # الكلاس الذي يبدأ منه iOS
          NSExtensionAttributes:
            # متى يظهر Saver في قائمة المشاركة: رابط واحد، أو نص فيه رابط
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
