# يبني IPA غير موقّع على جهاز Mac في GitHub في كل push
name: Build unsigned IPA

on:
  push:
  workflow_dispatch:   # زر "Run workflow" للتشغيل اليدوي

# صلاحية الكتابة لازمة لإنشاء Release ورفع الملف عليه
permissions:
  contents: write

# لو صار push مرتين بسرعة، لا يتسابق بناءان على نفس الـ Release
concurrency:
  group: build-ipa
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (no signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Saver.xcodeproj \
            -scheme Saver \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Saver.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Saver.xcarchive/Products/Applications/Saver.app Payload/
          zip -qry Saver.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saver-ipa
          path: Saver.ipa

      # رابط مباشر ثابت للـ IPA (بدون zip):
      # https://github.com/<owner>/<repo>/releases/download/latest/Saver.ipa
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # نحذف الإصدار القديم ونصنع جديداً يشير إلى هذا الـ commit
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Saver.ipa \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}" \
            --prerelease
